name: CI - Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Tests & Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -v -race -count=1 ./tests/...

      - name: Build Binaries
        run: |
          go build -v -o bin/lockforge-server ./cmd/lockforge-server
          go build -v -o bin/lockforge-cli ./cmd/lockforge-cli
          go build -v -o bin/lockforge-benchmark ./cmd/lockforge-benchmark
          go build -v -o bin/protected-resource ./cmd/protected-resource

  test-frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck and Build Bundle
        run: npm run build
